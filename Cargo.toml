[package]
name = "dev-env-setup"
version = "0.2.0"
edition = "2024"
description = "Interactive terminal setup for packages and dotfile links"
license = "MIT"
repository = "https://github.com/azakharau/dev-env-setup"
homepage = "https://github.com/azakharau/dev-env-setup"
readme = "README.md"
keywords = ["dotfiles", "bootstrap", "ratatui", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "dev-forge"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
crossterm = "0.29.0"
dirs = "6.0.0"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
toml = "0.9.11"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
